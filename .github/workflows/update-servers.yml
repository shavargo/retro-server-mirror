name: Update server lists

on:
  schedule:
    # Run once daily at 12:17 UTC
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and merge server lists
        run: |
          set -euo pipefail
          python3 scripts/fetch_servers.py
          count="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:[0-9]+' servers.txt | wc -l | tr -d ' ')"
          echo "Merged total address count: $count"
          test "$count" -ge 100

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.txt server.txt servers/ servers.json data/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh server lists from Lookout masters + OpenSpy"
          git push
